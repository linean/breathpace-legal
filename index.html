<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breathpace — Legal</title>
<meta name="description" content="Legal documents for the Breathpace mobile application." />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1117;
    --fg: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #7cc4ff;
    --border: #222834;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #1a1d23;
      --muted: #5b6472;
      --accent: #0a66c2;
      --border: #e3e6eb;
    }
  }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 20px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 14px 0; border-top: 1px solid var(--border); }
  li:last-child { border-bottom: 1px solid var(--border); }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Breathpace</h1>
  <p>Legal documents</p>
  <ul>
    <li><a href="./privacy-policy.html">Privacy Policy</a></li>
  </ul>
</main>
</body>
</html>
